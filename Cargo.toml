[package]
name = "dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
futures = "0.3"
rumqttc = "0.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
sha2 = "0.10"
azure_core = "1.1"
azure_data_cosmos = { version = "0.38", features = ["key_auth"] }